<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crafting Recipe Manager</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔮 Crafting Recipe Manager</h1>
            <p>Manage your crafting recipes with ease</p>
        </header>

        <div class="toolbar">
            <button class="btn btn-primary" id="addRecipeBtn">
                ➕ Add New Recipe
            </button>
            <button class="btn btn-success" id="exportRecipesBtn">
                📥 Export Recipes CSV
            </button>
            <button class="btn btn-info" id="exportCounterBtn">
                📊 Export Counter CSV
            </button>
            <button class="btn btn-warning" id="importDataBtn">
                📤 Import Data
            </button>
            <button class="btn btn-danger" id="resetDataBtn">
                🔄 Reset to Default
            </button>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Search recipes...">
            </div>
        </div>

        <div class="content">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Recipes</div>
                    <div class="stat-value" id="totalRecipes">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Unique Combinations</div>
                    <div class="stat-value" id="uniqueCombos">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Most Common Combo</div>
                    <div class="stat-value" id="mostCommon" style="font-size: 1.2em;">-</div>
                </div>
            </div>

            <div class="section">
                <h2 class="section-title">📋 All Recipes</h2>
                <div id="recipeTableContainer"></div>
            </div>

            <div class="section">
                <h2 class="section-title">📊 Element Combination Counter</h2>
                <div class="counter-grid" id="counterGrid"></div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div id="recipeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Recipe</h2>
                <button class="close" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <form id="recipeForm">
                    <input type="hidden" id="editIndex" value="-1">
                    
                    <div class="form-group">
                        <label for="itemName">Item Name *</label>
                        <input type="text" id="itemName" required placeholder="Enter item name">
                    </div>

                    <div class="form-group">
                        <label for="itemTier">Tier *</label>
                        <select id="itemTier" required>
                            <option value="1">Tier 1 (3x3 Grid)</option>
                            <option value="2">Tier 2 (4x4 Grid)</option>
                            <option value="3">Tier 3 (5x5 Grid)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Elements * (Select at least one)</label>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" name="elements" value="earth">
                                <span>🌍 Earth</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="elements" value="fire">
                                <span>🔥 Fire</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="elements" value="water">
                                <span>💧 Water</span>
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="elements" value="wind">
                                <span>💨 Wind</span>
                            </label>
                        </div>
                    </div>

                    <div class="shape-editor">
                        <div class="shape-editor-title">
                            <span>🎨 Recipe Shape Pattern</span>
                            <button type="button" class="clear-shape-btn" id="clearShapeBtn">
                                Clear Pattern
                            </button>
                        </div>
                        <div style="text-align: center;">
                            <div id="shapeEditorGrid" class="shape-editor-grid"></div>
                        </div>
                    </div>

                    <div style="display: flex; gap: 10px; margin-top: 30px;">
                        <button type="submit" class="btn btn-primary" style="flex: 1;">
                            💾 Save Recipe
                        </button>
                        <button type="button" class="btn btn-danger" id="cancelModalBtn" style="flex: 1;">
                            ❌ Cancel
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
